bedrock:
- name: "1.0"
  check:
    version: [1,0]
  map_data:
    mapId: '@id'
    parentMapId: -1L
    colors: '@colors'
    mapLocked: 1b
    scale: 4b
    dimension: 0b
    fullyExplored: 1b
    unlimitedTracking: 0b
    xCenter: 2147483647
    zCenter: 2147483647
    height: 128s
    width: 128s
  map_item:
    id: 358s
    Count: 1b
    tag:
      map_uuid: '@id'
  chest_item:
    id: 54
    Count: 1b
    tag:
      display:
        Name: '@name'
        Items: '@items'
# change from numeric to string item IDs
- name: "1.6"
  check:
    version: [1,6]
  map_item:
    Name: 'minecraft:map'
    Count: 1b
    tag:
      map_uuid: '@id'
  chest_item:
    Name: 'minecraft:chest'
    Count: 1b
    tag:
      Items: '@items'
      display:
        Name: '@name'
# structure blocks introduced
- name: "1.13"
  check:
    version: [1,13]
  structure_item:
    Name: 'minecraft:structure_block'
    Count: 1b
    tag:
      data: 2
      structureName: '@id'
      integrity: 100f
      xStructureOffset: 0
      yStructureOffset: 0
      zStructureOffset: 0
      xStructureSize: '@x'
      yStructureSize: '@y'
      zStructureSize: '@z'
      display:
        Name: '§r§d@id§r'
# item ID of map changed
- name: "1.16"
  check:
    version: [1,16,100]
  map_item:
    Name: 'minecraft:filled_map'
    Count: 1b
    tag:
      map_uuid: '@id'
# glow item frames added
- name: "1.16.210+"
  check:
    version: [1,16,210]
  glow_frames: true

